<!DOCTYPE html>
<html>
<head>
    <title>Sign In - Clarity AI</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #e0ecff, #f7f9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        .btn {
            padding: 10px 20px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background: #3a55d1;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">
    <h2> Sign In</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button class="btn">Login</button>
    </form>
</div>

</body>
</html>
