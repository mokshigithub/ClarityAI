<!DOCTYPE html>
<html>
<head>
    <title>Tools & Exercises</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #e0ecff, #f7f9ff);
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #4a6cf7;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            width: 320px;
            margin: 15px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #4a6cf7;
        }

        .desc {
            font-size: 15px;
            color: #555;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #4a6cf7;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #3a55d1;
        }
    </style>
</head>

<body>

<header>
    <h1>🛠 Tools & Exercises</h1>
    <p>Improve your mental clarity</p>
</header>

<div class="container">

    <div class="card">
        <div class="title">🫁 Breathing Exercise</div>
        <div class="desc">Inhale 4 seconds → Hold 4 seconds → Exhale 4 seconds</div>
    </div>

    <div class="card">
        <div class="title">📝 Journaling</div>
        <div class="desc">Write your thoughts to reduce stress and overthinking</div>
    </div>

    <div class="card">
        <div class="title">💭 Thought Transformation</div>
        <div class="desc">Convert negative thoughts into positive ones</div>
    </div>

    <a href="/" class="btn">⬅ Go Home</a>

</div>

</body>
</html>
