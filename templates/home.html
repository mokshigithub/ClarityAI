<!DOCTYPE html>
<html>
<head>
    <title>Clarity AI</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #e0f2fe, #f0f9ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.6);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #3b82f6;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 14px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(59,130,246,0.4);
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>

<body>

<div class="container" id="mainBox">
    <h1>Clarity AI</h1>
    <p>Transform your stress into clarity and peace.</p>

    <button id="openBtn" class="btn" onclick="openApp()">
        Open Clarity AI
    </button>
</div>

<iframe id="medoFrame"></iframe>

<script>
function openApp() {
   
    document.getElementById("mainBox").style.display = "none";
    document.getElementById("medoFrame").style.display = "block";
    document.getElementById("medoFrame").src = "https://app-83wmz1rz8s8x.appmedo.com";
}
</script>

</body>
</html>
